name: CI

on:
  # CI runs on pull requests and on pushes to main, not on every push to dev (dev is the working branch).
  # Pushes to main that only touch documentation or license texts do not need a build; pull requests always run, because the required checks of the main ruleset must report on every PR (otherwise a docs-only or site-only PR waits forever). Add [skip ci] to a commit
  # message to skip a run entirely, or start it by hand from the Actions tab (workflow_dispatch).
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "website/**", "licenses/**", "THIRD_PARTY_NOTICES.md", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_apk:
        description: Also build a debug APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stop on known vulnerable dependencies
        # Production packages only: they are what ends up in the app.
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  dependency-review:
    name: Dependencies added by this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  debug-apk:
    name: Debug APK (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The Android project compiles for Java 21 (see android/app/capacitor.build.gradle).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: macro-grid-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
