name: Website

# Builds the VitePress site in website/ and deploys it to GitHub Pages (Settings, Pages, Source: GitHub Actions).
# The site is only deployed from main (the github-pages environment accepts no other ref). The download page reads the
# GitHub releases at build time, so a release being published, edited or deleted rebuilds it: a release event runs on the
# release's tag, so it only starts a normal run of this workflow on main (the "from-release" job).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  from-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the site build on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "${{ github.repository }}"

  build:
    # A release event only starts the run above; the site itself is built by the run on main.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The site source always comes from main.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # VitePress fails the build on a dead internal link. The releases are fetched here (data loader).
      - name: Build the site
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run docs:build

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
