name: Release

# Runs when a tag such as client-v0.1.0 is pushed. It checks that the tag builds and creates a DRAFT release
# with the notes but WITHOUT an APK: the maintainer signs the APK locally, uploads it to the draft and
# publishes it by hand (see docs/release.md).
on:
  push:
    tags: ["client-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "client-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Stop on known vulnerable dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # A debug-signed APK, kept only as proof that the tag builds into an installable app. It is NOT attached
      # to the release: the release APK is signed on the maintainer's PC (the key is never put on GitHub) and
      # uploaded to the draft by hand, see docs/release.md.
      - name: Build debug APK (build check only)
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: macro-grid-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # CycloneDX list of the npm packages the app bundles (production only, read from package-lock.json). The Android
      # libraries that Gradle adds are not in it yet. The renderer's demo workspace is listed although it is not shipped.
      - name: Write the software bill of materials
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --ignore-npm-errors --package-lock-only --output-format JSON --output-file "MacroGrid-Client-${VERSION}-sbom.cdx.json"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # The body is this version's section of docs/CHANGELOG.md plus a short fixed footer; the phone app's
          # update screen shows it. Only the SBOM is attached here, no APK.
          ./scripts/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -Footer docs/release-notes-footer.md | Set-Content -Encoding utf8 release-notes.md
          gh release create $env:GITHUB_REF_NAME "MacroGrid-Client-$env:VERSION-sbom.cdx.json" `
            --draft --prerelease `
            --title "Macro Grid client $env:VERSION (alpha)" `
            --notes-file release-notes.md
